name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  msvc-build:
    name: MSVC build and smoke test
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      # FetchContent invokes Git submodule helpers while obtaining dependencies.
      # Those helpers require Git for Windows' POSIX utility directory.
      - name: Enable Git for Windows helper utilities
        shell: pwsh
        run: |
          "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: >
          cmake --preset msvc-release
          -DBUILD_TESTING=OFF
          -DZLIBNG=OFF

      - name: Build
        run: cmake --build --preset msvc-release --parallel 2

      - name: Smoke test
        shell: pwsh
        run: '& .\out\build\msvc-release\src\kallisto.exe version'
